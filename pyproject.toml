[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gesture-controls"
version = "0.1.0"
description = "Controle do desktop Ubuntu por gestos capturados pela webcam."
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "mediapipe>=1.1.1,<2",
    "PySide6>=6.7,<7",
]

[project.scripts]
gesture-controls = "gesture_controls.app:main"

[tool.setuptools.packages.find]
where = ["src"]
